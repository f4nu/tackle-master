    <path d="M 374.1 182.8 Q 371.1 200.4 387.4 215.6 L 395.2 201.4 Z" fill="#e2661c" stroke="#1b1a2e" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="366" cy="146.4" r="10" fill="#1b1a2e"/>
    <circle cx="363" cy="143.4" r="3.2" fill="#ffffff"/>

    <!-- splashes where they left the water -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="66" cy="326" r="8"/><circle cx="46" cy="350" r="5"/><circle cx="88" cy="346" r="4"/>
      <circle cx="446" cy="326" r="8"/><circle cx="466" cy="350" r="5"/><circle cx="424" cy="346" r="4"/>
