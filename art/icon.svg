      <stop offset="0.45" stop-color="#fbf4e6"/>
      <stop offset="1" stop-color="#c2b7a4"/>
    </linearGradient>
    <linearGradient id="quill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff9ea"/>
      <stop offset="1" stop-color="#d9cfb8"/>
    </linearGradient>
    <clipPath id="frame">
      <rect x="14" y="14" width="484" height="484" rx="34"/>
    </clipPath>
    <clipPath id="bobberClip">
