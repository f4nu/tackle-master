  <!-- frame: a dark rounded square like the item icons it sits next to -->
  <rect x="0" y="0" width="512" height="512" rx="46" fill="#0d1526"/>

  <g clip-path="url(#frame)">
    <rect x="0" y="0" width="512" height="512" fill="url(#sky)"/>
    <ellipse cx="256" cy="300" rx="230" ry="190" fill="url(#glow)"/>

