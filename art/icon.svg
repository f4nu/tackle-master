      <path id="bobberShape" d="M -76 -24 C -76 -76 -42 -110 0 -110 C 42 -110 76 -76 76 -24 C 76 40 46 100 0 100 C -46 100 -76 40 -76 -24 Z"/>
    </clipPath>
