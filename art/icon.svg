    <!-- front waves -->
    <path d="M -158 428 C -129.8 428 -117 404 -91.4 404 C -71 404 -63.3 428 -30 428 C -1.8 428 11 404 36.6 404 C 57 404 64.7 428 98 428 C 126.2 428 139 404 164.6 404 C 185 404 192.7 428 226 428 C 254.2 428 267 404 292.6 404 C 313 404 320.7 428 354 428 C 382.2 428 395 404 420.6 404 C 441 404 448.7 428 482 428 C 510.2 428 523 404 548.6 404 C 569 404 576.7 428 610 428 C 638.2 428 651 404 676.6 404 C 697 404 704.7 428 738 428 L 738 560 L -158 560 Z" fill="url(#foam)" stroke="#1b1a2e" stroke-width="9"/>
