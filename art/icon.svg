<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15356a"/>
      <stop offset="0.55" stop-color="#2d6fae"/>
      <stop offset="1" stop-color="#4fa3d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fe0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9fe0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a86c0"/>
      <stop offset="1" stop-color="#17598f"/>
    </linearGradient>
    <linearGradient id="waterFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c6aa6"/>
      <stop offset="1" stop-color="#0c3561"/>
    </linearGradient>
    <linearGradient id="foam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#a6daf7"/>
    </linearGradient>
    <linearGradient id="fishL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd25c"/>
      <stop offset="1" stop-color="#f5861f"/>
    </linearGradient>
    <linearGradient id="fishLFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7a233"/>
      <stop offset="1" stop-color="#d95f14"/>
    </linearGradient>
    <linearGradient id="fishR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd25c"/>
      <stop offset="1" stop-color="#f5861f"/>
    </linearGradient>
    <linearGradient id="fishRFin" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a233"/>
      <stop offset="1" stop-color="#d95f14"/>
    </linearGradient>
    <linearGradient id="bobRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6a5a"/>
      <stop offset="0.45" stop-color="#e5261f"/>
      <stop offset="1" stop-color="#8e0f10"/>
    </linearGradient>
    <linearGradient id="bobWhite" x1="0" y1="0" x2="1" y2="0">
