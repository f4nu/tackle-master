    <circle cx="143" cy="143.4" r="3.2" fill="#ffffff"/>
    <g stroke="#1b1a2e" stroke-width="11" stroke-linejoin="round">
      <path d="M 485.6 292.4 Q 504.6 305.3 518 322 Q 495.3 313.6 484.3 310.8 Q 476 317.3 461.8 334.2 Q 464.4 314.6 473.5 295.7 Z" fill="url(#fishRFin)"/>
