        <path d="M -90 -2 C -60 18 60 18 90 -2" fill="none" stroke="#1b1a2e" stroke-width="5" opacity="0.4"/>
        <ellipse cx="-34" cy="-40" rx="11" ry="46" fill="#ffffff" opacity="0.4"/>
